<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Student Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
            text-align: center;
        }

        h1 {
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            color: #dc3545;
            margin-top: 15px;
        }
    </style>

</head>


<body>

    <div class="box">

        <h1>🔑 Reset Password</h1>

        <div class="subtitle">
            Create a new password
        </div>


        <form method="POST" action="/reset_password">

            <input type="hidden" name="email" value="{{ email }}">


            <input type="password" name="password" placeholder="New Password" minlength="6" required>


            <input type="password" name="confirm_password" placeholder="Confirm New Password" minlength="6" required>


            <button type="submit">
                🔐 Reset Password
            </button>

        </form>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>

</html>
