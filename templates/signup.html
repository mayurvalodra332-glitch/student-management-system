<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Student Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .signup-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
            text-align: center;
        }

        h1 {
            color: #1f3c88;
            margin-bottom: 10px;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 98%;
            padding: 13px;
            margin-top: 10px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            color: #dc3545;
            margin-top: 15px;
        }

        .login {
            margin-top: 20px;
        }

        .login a {
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="signup-box">

        <h1>🎓 Student Management</h1>

        <p>Create your account</p>

        <form method="POST" action="/signup">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="password" name="password" placeholder="Create Password" minlength="6" required>

            <input type="password" name="confirm_password" placeholder="Confirm Password" minlength="6" required>

            <button type="submit">
                📝 Create Account
            </button>

        </form>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <div class="login">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</body>

</html>
