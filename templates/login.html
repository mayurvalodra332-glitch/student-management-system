<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Student Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #ccc;
            text-align: center;
        }

        h1 {
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 45px;
        }

        .eye {
            position: absolute;
            right: 14px;
            top: 20px;
            cursor: pointer;
            color: #555;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .error {
            color: #dc3545;
            margin-top: 15px;
        }

        .success {
            color: #28a745;
            margin-top: 15px;
            font-weight: bold;
        }

        .forgot {
            display: block;
            margin-top: 15px;
            color: #1f3c88;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .signup {
            margin-top: 22px;
            color: #666;
        }

        .signup a {
            color: #1f3c88;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>


<body>


    <div class="login-box">

        <h1>🎓 Student Management</h1>

        <div class="subtitle">
            Login to your account
        </div>


        <form method="POST" action="/login">


            <input type="email" name="email" placeholder="Email Address" required>


            <div class="password-box">

                <input type="password" id="password" name="password" placeholder="Password" required>

                <span class="eye" onclick="togglePassword()">
                    👁️
                </span>

            </div>


            <button type="submit">
                🔐 Login
            </button>


        </form>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if request.args.get("reset") == "success" %}

        <div class="success">
            Password reset successfully! Please login.
        </div>

        {% endif %}


        <a class="forgot" href="/forgot_password">
            Forgot Password?
        </a>


        <div class="signup">

            Don't have an account?

            <a href="/signup">
                Sign Up
            </a>

        </div>


    </div>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }

    </script>


</body>

</html>
